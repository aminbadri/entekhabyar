<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسه | انتخاب رشته ۱۴۰۵</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><header><div class="brand">مقایسه گزینه‌ها</div><nav><a href="../">خانه</a><a href="../dashboard/">داشبورد</a><a href="../atlas/">اطلس</a></nav></header><main style="max-width:1200px;margin:40px auto;padding:0 25px"><div class="eyebrow">مقایسه بدون رتبه‌بندی</div><h1>اطلاعات را کنار هم ببینید</h1><p style="color:#65746f">این صفحه برای مقایسه مستند شاخص‌هاست؛ سامانه بر اساس آنها «بهترین» گزینه را اعلام نمی‌کند.</p><div class="search"><input id="q" placeholder="رشته موردنظر…"><button onclick="show()">نمایش</button></div><div id="result" style="margin-top:25px"></div></main><script>async function show(){const q=document.getElementById('q').value.trim();const j=await fetch('../data/jobvision_metrics.json').then(r=>r.json());const rows=(j.records||[]).filter(x=>(x.course_name||'').includes(q)||(x.university_name||'').includes(q)).slice(0,30);document.getElementById('result').innerHTML=rows.length?'<div class="tile"><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>رشته</th><th>دانشگاه</th><th>اشتغال مرتبط</th><th>حقوق سال اول</th><th>ظرفیت</th><th>منبع</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.course_name||'—'}</td><td>${x.university_name||'—'}</td><td>${x.related_employment_percent||'داده موجود نیست'}</td><td>${x.salary_year1_million_toman||'داده موجود نیست'}</td><td>${x.capacity||'داده موجود نیست'}</td><td>صفحه ${x.source_page}</td></tr>`).join('')+'</tbody></table></div></div>':'<div class="tile"><h2>داده‌ای برای این جست‌وجو موجود نیست</h2><p>پس از اجرای ETL جاب‌ویژن، فقط Matchهای تأییدشده نمایش داده می‌شوند.</p></div>'}const q=new URLSearchParams(location.search).get('q');if(q){document.getElementById('q').value=q;show()}</script></body></html>
