<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اطلس ظرفیت ۱۴۰۴</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><header><div class="brand">اطلس جغرافیایی <b>۱۴۰۴</b></div><nav><a href="../">خانه</a><a href="../dashboard/">داشبورد</a><a href="../compare/">مقایسه</a></nav></header><main style="max-width:1200px;margin:40px auto;padding:0 25px"><div class="eyebrow">داده سنجش • ۳۱ استان</div><h1>ظرفیت پذیرش در ایران</h1><p style="color:#65746f">مقادیر زیر مستقیماً از خلاصه داده ممیزی‌شده پروژه مرجع گرفته شده‌اند. اینها ظرفیت پذیرش اعلام‌شده هستند.</p><div id="atlas" class="grid" style="padding:0;max-width:none"></div></main><script>fetch('../data/sanjesh_summary.json').then(r=>r.json()).then(s=>{document.getElementById('atlas').innerHTML=s.byProvince.sort((a,b)=>b.capacity-a.capacity).map((p,i)=>`<div class="tile"><span>${String(i+1).padStart(2,'0')}</span><h2>${p.name}</h2><p><b>${p.capacity.toLocaleString('fa-IR')}</b> ظرفیت</p><p>${p.records.toLocaleString('fa-IR')} رشته‌محل • ${p.universities.toLocaleString('fa-IR')} مؤسسه</p></div>`).join('')})</script></body></html>
